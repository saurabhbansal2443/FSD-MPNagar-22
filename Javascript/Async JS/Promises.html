    function cutTheBread(raw) {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (raw) {
            resolve("Cutted Bread");
          } else {
            reject("Reject of cutted the bread");
          }
        }, 2000);
      });
    }

    function addStuffings(bread) {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (bread) {
            resolve("Stuffed Bread");
          } else {
            reject("Reject of add stuffings");
          }
        }, 2000);
      });
    }

    function bake(stuffed) {
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          if (stuffed) {
            resolve("Sandwich");
          } else {
            reject("Reject of bake");
          }
        }, 2000);
      });
    }

    // Async and await are two keywords which are used to resolve promises

    async function makeSandwich() {
      let cuttedBread = await cutTheBread("raw");
      console.log(cuttedBread);
      let stuffed = await addStuffings(cuttedBread);
      console.log(stuffed);
      let sandwich = await bake(cuttedBread);
